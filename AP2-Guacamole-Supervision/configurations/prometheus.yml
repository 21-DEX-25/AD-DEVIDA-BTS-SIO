# Configuration reconstituée des cibles démontrées.
# Les alertes de ce projet sont évaluées dans Grafana.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    scrape_interval: 5s
    scrape_timeout: 5s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    static_configs:
      - targets: ['localhost:9100', '10.2.61.121:9100']

  - job_name: windows
    static_configs:
      - targets: ['10.2.61.100:9182']

  - job_name: guacamole_web
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://10.2.61.121:8080/guacamole/']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: localhost:9115
